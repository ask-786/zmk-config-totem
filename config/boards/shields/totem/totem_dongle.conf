# BLE configuration
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2
CONFIG_ZMK_USB_BOOT=y
CONFIG_BT_MAX_PAIRED=4
CONFIG_BT_MAX_CONN=4

# Disable passkey entry since it's a dongle
CONFIG_ZMK_BLE_PASSKEY_ENTRY=n

# Increase BT signal strength
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Battery monitoring
CONFIG_BT_BAS=y
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

CONFIG_ZMK_BATTERY_REPORTING_BLE=y
CONFIG_ZMK_BATTERY_REPORTING_USB=y
CONFIG_ZMK_BATTERY_REPORTING_SPLIT_FETCHING=y
CONFIG_ZMK_BATTERY_REPORTING_SPLIT_PROXY=y
CONFIG_ZMK_BATTERY_REPORTING_SPLIT_REPORT_LOWEST_CHARGE=n
